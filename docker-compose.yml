services:
  jimu:
    image: ghcr.io/0ql/jimu:latest
    container_name: jimu
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=/app/data/sqlite.db
      # adapter-node 6 no longer reads ORIGIN; it takes the host from the request.
      # Behind an HTTPS reverse proxy, forward the original protocol and host instead:
      # - PROTOCOL_HEADER=x-forwarded-proto
      # - HOST_HEADER=x-forwarded-host
      # A Claude/ChatGPT connector under its own public name (e.g. a tunnel that only lets the
      # MCP and OAuth paths through), while the app itself is only reachable over a VPN:
      # - CONNECTOR_URL=https://jimu-mcp.example.com   # what the connector talks to
      # - APP_URL=https://jimu.example.com             # where you approve it in your browser
    volumes:
      - jimu-data:/app/data
    restart: unless-stopped

volumes:
  jimu-data:
